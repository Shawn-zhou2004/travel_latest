server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://host.docker.internal:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The browser calls this same-origin path; Nginx appends the private JSAPI
    # security code before forwarding it to AMap.
    location /_AMapService/ {
        set $amap_args "$args&jscode=${AMAP_SECURITY_JS_CODE}";
        rewrite ^/_AMapService/(.*)$ /$1 break;
        proxy_pass https://restapi.amap.com$uri?$amap_args;
        proxy_set_header Host restapi.amap.com;
        proxy_ssl_server_name on;
    }
}
