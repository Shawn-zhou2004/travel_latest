[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-travel-api"
version = "0.1.0"
description = "AI travel platform API"
requires-python = ">=3.11"
dependencies = [
    "aio-pika>=9.4,<10.0",
    "alibabacloud-dypnsapi20170525>=2.0,<3.0",
    "alibabacloud-tea-openapi>=0.4,<1.0",
    "alibabacloud-tea-util>=0.3,<1.0",
    "alembic>=1.14,<2.0",
    "aiomysql>=0.2,<1.0",
    "aiosqlite>=0.20,<1.0",
    "asyncpg>=0.30,<1.0",
    "bcrypt>=4.1,<5.0",
    "boto3>=1.35,<2.0",
    "cryptography>=42.0,<45.0",
    "elasticsearch[async]>=8.15,<9.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "langchain>=1.0,<2.0",
    "langchain-core>=0.3",
    "langchain-openai>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-postgres>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "pymilvus>=2.5,<3.0",
    "pymysql>=1.1,<2.0",
    "python-docx>=1.1,<2.0",
    "redis>=5.0,<7.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
test = [
    "anyio>=4.0,<5.0",
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
